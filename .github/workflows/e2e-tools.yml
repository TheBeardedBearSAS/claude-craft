name: E2E Tools/ (bats + Docker)

on:
  push:
    branches: [main]
    paths:
      - 'Tools/**/*.sh'
      - 'tests/e2e/tools/**'
      - '.github/workflows/e2e-tools.yml'
  pull_request:
    paths:
      - 'Tools/**/*.sh'
      - 'tests/e2e/tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E scripts bash (docker-compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned: v4.2.2

      - name: Run E2E suite in Docker
        run: |
          cd tests/e2e/tools
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from e2e-runner

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned: v7.0.1
        with:
          name: e2e-report-${{ github.sha }}
          path: tests/e2e/tools/artifacts/
          retention-days: 14
