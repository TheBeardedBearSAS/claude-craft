name: E2E Tools/ (bats + Docker)

on:
  push:
    branches: [main]
    paths:
      - 'Tools/**/*.sh'
      - 'tests/e2e/tools/**'
      - '.github/workflows/e2e-tools.yml'
  pull_request:
    paths:
      - 'Tools/**/*.sh'
      - 'tests/e2e/tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E scripts bash (docker-compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - name: Run E2E suite in Docker
        run: |
          cd tests/e2e/tools
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from e2e-runner

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned: v7.0.2
        with:
          name: e2e-report-${{ github.sha }}
          path: tests/e2e/tools/artifacts/
          retention-days: 14
