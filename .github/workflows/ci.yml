name: CI

# Pull-request gate: runs Vitest with coverage thresholds on every PR.
# Tag/main publishes still run via .github/workflows/npm-publish.yml.
# Audit 2026-05-18 QW-05 — fix CI gap where tests were only enforced on release.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cli/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - '.claude/**'
      - 'Dev/i18n/**'
      - 'Infra/i18n/**'
      - 'Project/i18n/**'
      - 'Tools/**'
      - 'website/tests/kanban/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.*'
      - 'eslint.config.*'
  # push to main intentionally removed: npm-publish.yml already runs the full
  # test suite (build job) on every push to main, avoiding a double-run.
  # workflow_dispatch allows manual triggers for branch investigation.
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vitest:
    name: Vitest + coverage (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # REL-002: Node 20 reached EOL 2026-04-30. Node 26 is the Active LTS since 2026-10-28;
        # Node 24 and 22 are Maintenance LTS (22 reaches EOL on 2027-04-30).
        node: ['22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned: v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned: v7.0.2
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  content-validation:
    name: Content validation (.claude/ agents, commands, skills)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned: v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate content (agents, commands, skills, doc counts)
        run: npm run test:content

  i18n-parity:
    name: i18n parity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned: v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run i18n parity check
        run: npm run lint:i18n

  shellcheck:
    name: ShellCheck (shell scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned: v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: npm run lint:shell

  docs-check:
    name: Docs sync check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned: v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify generated docs are up-to-date
        run: npm run docs:check

      - name: Verify Claude `@-include` links resolve
        run: npm run lint:includes

      - name: Verify version consistency (single source of truth)
        run: npm run lint:versions

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # pinned: v4
        with:
          languages: javascript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # pinned: v4

  npm-audit:
    name: npm security audit (moderate+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned: v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # SEC-011: rule 11-security.md mandates --audit-level=moderate (block moderate+high).
      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

  # Audit K-12: builds the Kanban client on every PR and runs the browser harness
  # (smoke, axe, reflow, keyboard) against a copy of tests/fixtures/wrandly-anon.
  kanban-e2e:
    name: Kanban client build + browser tests (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The official Playwright image ships the three browsers and their system libraries: nothing is installed with
    # apt during the run (that step hung for more than an hour when the runners could not resolve the Ubuntu
    # mirrors). The tag must match the @playwright/test version of website/package-lock.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --user 1001
    # One job per engine (parallel) rather than one job three times longer. `projects` is what runs
    # (website/tests/kanban/playwright.config.ts); the touch projects only run touch.spec.ts.
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project=chromium
          - engine: firefox
            projects: --project=firefox
          - engine: webkit
            projects: --project=webkit
          - engine: touch
            projects: --project=mobile-chrome --project=mobile-safari
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned: v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Kanban client
        run: npm run kanban:build

      - name: Install website (Playwright) dependencies
        run: cd website && npm ci

      - name: Check the image matches the installed Playwright
        run: test "$(node -p "require('./website/node_modules/@playwright/test/package.json').version")" = "1.65.0"

      - name: Run Kanban browser tests
        run: cd website && npm run test:kanban -- ${{ matrix.projects }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned: v7.0.2
        with:
          name: kanban-e2e-report-${{ matrix.engine }}
          path: |
            website/tests/kanban/report/
            website/tests/kanban/results/
          if-no-files-found: ignore
          retention-days: 7

  trivy:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # pinned: master @ 2026-06-08
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
