name: Mutation Testing (Stryker)

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly: lundi 3h UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'cli/**'
      - 'stryker.config.mjs'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  mutation:
    name: Stryker mutation score
    runs-on: ubuntu-latest
    # Blocking on PRs (audit 2026-05-18 QW-11). The weekly (Monday) schedule remains
    # informational only — if the weekly run fails on transient network /
    # CI flakiness we don't want to wake anyone up.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned: v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # pinned: v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore incremental cache (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # pinned: v5
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ github.base_ref }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            stryker-incremental-${{ github.base_ref }}-

      - name: Run Stryker (weekly full)
        if: github.event_name != 'pull_request'
        # Weekly: tolerant — informational signal only.
        run: npx stryker run || true

      - name: Run Stryker (PR incremental — mutate only changed files)
        if: github.event_name == 'pull_request'
        # PR: blocking. Threshold (mutationScore.break / .high / .low) is
        # configured in stryker.config.mjs. CI fails if the score falls
        # below the `break` threshold.
        run: npx stryker run --incremental

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned: v7.0.1
        with:
          name: mutation-report-${{ github.sha }}
          path: reports/mutation/
          retention-days: 30

      - name: PR comment with score
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            # Score computed by scripts/stryker-score.mjs (ESM, explicit error handling —
            # audit 2026-06-08 P3, replaces the inline node -e that silently masked errors).
            score=$(node scripts/stryker-score.mjs reports/mutation/mutation.json)
            echo "Mutation score: $score" >> "$GITHUB_STEP_SUMMARY"
          fi
