name: Mutation Testing (Stryker)

on:
  schedule:
    - cron: '0 3 * * 1'  # Nightly-weekly: lundi 3h UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'cli/**'
      - 'stryker.config.mjs'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  mutation:
    name: Stryker mutation score
    runs-on: ubuntu-latest
    continue-on-error: true  # non-blocking
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned: v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned: v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore incremental cache (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ github.base_ref }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            stryker-incremental-${{ github.base_ref }}-

      - name: Run Stryker (nightly full)
        if: github.event_name != 'pull_request'
        run: npx stryker run || true

      - name: Run Stryker (PR incremental — mute only changed files)
        if: github.event_name == 'pull_request'
        run: npx stryker run --incremental || true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned: v4.6.2
        with:
          name: mutation-report-${{ github.sha }}
          path: reports/mutation/
          retention-days: 30

      - name: PR comment with score
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            score=$(jq -r '.mutationScore // "N/A"' reports/mutation/mutation.json 2>/dev/null || echo "N/A")
            echo "Mutation score: $score" >> "$GITHUB_STEP_SUMMARY"
          fi
