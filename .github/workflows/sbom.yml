name: Generate SBOM

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

# SEC-005: top-level default is read-only; contents:write is scoped to the release job only.
permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    # SEC: id-token:write required for Sigstore keyless (OIDC) signing of the SBOM (rule 11).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # pinned: v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CycloneDX CLI
        # Pinned major to avoid the SBOM generator itself being a floating dependency.
        run: npm install --no-save @cyclonedx/cyclonedx-npm@5

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file claude-craft-sbom.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # pinned: v4.1.2

      - name: Sign SBOM (Sigstore keyless)
        # Best-effort: OIDC keyless signing requires the workflow to run on the upstream repo
        # (not a fork). Don't fail the whole SBOM job if signing is unavailable; the bundle is
        # attached when present.
        continue-on-error: true
        run: cosign sign-blob --yes claude-craft-sbom.json --bundle claude-craft-sbom.json.bundle

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned: v7.0.1
        with:
          name: sbom-cyclonedx
          path: |
            ./claude-craft-sbom.json
            ./claude-craft-sbom.json.bundle
          retention-days: 90

  release:
    name: Attach SBOM to GitHub Release
    runs-on: ubuntu-latest
    needs: generate-sbom
    if: github.ref_type == 'tag'
    # SEC-005: contents:write restricted to this job only (needed to upload release assets)
    permissions:
      contents: write
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pinned: v8.0.1
        with:
          name: sbom-cyclonedx

      - name: Attach SBOM + signature to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # pinned: v2.3.2
        with:
          files: |
            ./claude-craft-sbom.json
            ./claude-craft-sbom.json.bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
