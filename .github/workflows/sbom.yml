name: Generate SBOM

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned: v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642195b8c39babe6eb30190 # pinned: v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-node-module-generatebom@1ca7f1f39708e51cdcddd0e34e00e2a05b7ea73b # pinned: v2.0.0
        with:
          path: './'
          output: './claude-craft-sbom.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned: v4.6.2
        with:
          name: sbom-cyclonedx
          path: ./claude-craft-sbom.json
          retention-days: 90

      - name: Attach SBOM to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # pinned: v2.3.2
        with:
          files: ./claude-craft-sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
