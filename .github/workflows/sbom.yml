name: Generate SBOM

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

# SEC-005: top-level default is read-only; contents:write is scoped to the release job only.
permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned: v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # pinned: v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CycloneDX CLI
        run: npm install --no-save @cyclonedx/cyclonedx-npm

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file claude-craft-sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned: v7.0.1
        with:
          name: sbom-cyclonedx
          path: ./claude-craft-sbom.json
          retention-days: 90

  release:
    name: Attach SBOM to GitHub Release
    runs-on: ubuntu-latest
    needs: generate-sbom
    if: github.ref_type == 'tag'
    # SEC-005: contents:write restricted to this job only (needed to upload release assets)
    permissions:
      contents: write
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # pinned: v4.2.1
        with:
          name: sbom-cyclonedx

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # pinned: v2.3.2
        with:
          files: ./claude-craft-sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
