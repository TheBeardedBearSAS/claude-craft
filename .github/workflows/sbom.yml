name: Generate SBOM

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

# SEC-005: top-level default is read-only; contents:write is scoped to the release job only.
permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # pinned: v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # pinned: v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CycloneDX CLI
        run: npm install --no-save @cyclonedx/cyclonedx-npm

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file claude-craft-sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned: v7.0.1
        with:
          name: sbom-cyclonedx
          path: ./claude-craft-sbom.json
          retention-days: 90

  release:
    name: Attach SBOM to GitHub Release
    runs-on: ubuntu-latest
    needs: generate-sbom
    if: github.ref_type == 'tag'
    # SEC-005: contents:write restricted to this job only (needed to upload release assets)
    permissions:
      contents: write
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pinned: v8.0.1
        with:
          name: sbom-cyclonedx

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # pinned: v2.3.2
        with:
          files: ./claude-craft-sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
