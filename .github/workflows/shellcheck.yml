name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck -S error (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned: v6.0.3

      - name: Run ShellCheck (Docker)
        run: |
          docker run --rm \
            -v "$PWD:/mnt" \
            -w /mnt \
            koalaman/shellcheck-alpine:stable \
            sh -c '
              set -e
              files=$(find Tools Dev/scripts Infra .claude/hooks scripts hooks -name "*.sh" 2>/dev/null | grep -v "Tools/i18n/" || true)
              if [ -z "$files" ]; then
                echo "No shell scripts to check"
                exit 0
              fi
              count=$(echo "$files" | wc -l)
              echo "Checking $count scripts with shellcheck -S error..."
              echo "$files" | xargs shellcheck -S error -x
            '

      - name: Harden enforcement (check set -euo pipefail)
        run: |
          missing=$(find Tools Dev/scripts Infra .claude/hooks scripts -name '*.sh' 2>/dev/null \
            | grep -v 'Tools/i18n/' \
            | grep -v 'MultiAccount/claude-accounts.sh' \
            | grep -v 'lib/tools-ui.sh' \
            | xargs grep -L 'set -euo pipefail' 2>/dev/null || true)
          if [ -n "$missing" ]; then
            echo "Scripts missing 'set -euo pipefail':"
            echo "$missing"
            exit 1
          fi
          echo "All executable scripts have strict bash mode enabled."
