name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck -S error (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned: v4.2.2

      - name: Run ShellCheck (Docker)
        run: |
          docker run --rm \
            -v "$PWD:/mnt" \
            -w /mnt \
            koalaman/shellcheck-alpine:stable \
            sh -c '
              set -e
              mapfile -t files < <(find Tools Dev/scripts Infra .claude/hooks scripts hooks -name "*.sh" 2>/dev/null | grep -v "Tools/i18n/")
              if [ ${#files[@]} -eq 0 ]; then
                echo "No shell scripts to check"
                exit 0
              fi
              echo "Checking ${#files[@]} scripts with shellcheck -S error..."
              shellcheck -S error -x "${files[@]}"
            '

      - name: Harden enforcement (check set -euo pipefail)
        run: |
          missing=$(find Tools Dev/scripts Infra .claude/hooks scripts -name '*.sh' 2>/dev/null \
            | grep -v 'Tools/i18n/' \
            | xargs grep -L 'set -euo pipefail' 2>/dev/null || true)
          if [ -n "$missing" ]; then
            echo "Scripts missing 'set -euo pipefail':"
            echo "$missing"
            exit 1
          fi
          echo "All executable scripts have strict bash mode enabled."
