name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# SEC-007: minimum permissions — contents:write only for local signature storage on 'cla-signatures' branch.
# PERSONAL_ACCESS_TOKEN removed: not needed when signatures are stored in the same repo (no remote-organization-name set).
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read and agree to the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # pinned: v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures/v1/signatures.json'
          path-to-document: 'https://github.com/TheBeardedBearSAS/claude-craft/blob/main/.github/CLA.md'
          # Store signatures on a dedicated UNPROTECTED branch: main is protected
          # ("changes must be made through a PR"), so GITHUB_TOKEN cannot commit the
          # signatures file there. cla-signatures has no protection rule.
          branch: 'cla-signatures'
          allowlist: 'dependabot,dependabot[bot],renovate,renovate[bot],github-actions[bot]'
          # Signatures are stored in THIS repo (.github/cla-signatures/...) via GITHUB_TOKEN
          # (contents: write above). Setting remote-organization/repository-name forces the
          # action into "remote" mode which requires a PERSONAL_ACCESS_TOKEN — we don't need it.
          custom-pr-sign-comment: 'I have read and agree to the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
          lock-pullrequest-aftermerge: false
