name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures/v1/signatures.json'
          path-to-document: 'https://github.com/TheBeardedBearSAS/claude-craft/blob/main/.github/CLA.md'
          branch: 'main'
          allowlist: 'dependabot,dependabot[bot],renovate,renovate[bot],github-actions[bot]'
          remote-organization-name: 'TheBeardedBearSAS'
          remote-repository-name: 'claude-craft'
          custom-pr-sign-comment: 'I have read and agree to the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
          lock-pullrequest-aftermerge: false
