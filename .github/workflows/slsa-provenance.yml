name: SLSA Provenance

on:
  workflow_run:
    workflows: ["Publish to NPM"]
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions: read-all

jobs:
  # This job generates SLSA Build L3 provenance for the npm package
  # The provenance is automatically published to the npm registry alongside the package
  build:
    name: Generate SLSA Provenance
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: write
      actions: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned: v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned: v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm pack

      - name: Generate hashes
        id: hash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name.replace('@', '').replace('/', '-')")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TARBALL="${PACKAGE_NAME}-${PACKAGE_VERSION}.tgz"

          echo "Generating hash for ${TARBALL}"
          sha256sum "${TARBALL}" | awk '{print $1}' > hash.txt
          echo "hashes=$(cat hash.txt | base64 -w0)" >> $GITHUB_OUTPUT

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned: v4.6.2
        with:
          name: npm-package
          path: '*.tgz'
          retention-days: 5

  # Generate SLSA provenance using slsa-github-generator
  provenance:
    name: Generate SLSA Provenance Attestation
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
