name: i18n Parity

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dev/i18n/**'
      - 'docs/guides/**'
      - 'Infra/i18n/**'
      - 'Project/i18n/**'
      - 'website/**'
      - 'scripts/verify-i18n-parity.sh'
      - '.github/workflows/i18n-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: File count + size parity (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned: v4.2.2
      # Since v8.8.2 the script defaults to STRICT_SIZE=1 + I18N_PARITY_STRICT=1,
      # so this job now blocks on both file-count AND size-ratio (< 0.80) gaps.
      - name: Check count + strict size parity
        run: bash scripts/verify-i18n-parity.sh

  size-report:
    name: Size gap snapshot (reporting only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned: v4.2.2
      - name: Generate size gap report (threshold 0.80)
        env:
          STRICT_SIZE: '1'
          I18N_SIZE_THRESHOLD: '0.80'
        run: bash scripts/verify-i18n-parity.sh || true
      - name: Report gap summary
        run: |
          if [ -f audit/phases/i18n-gap.csv ]; then
            echo "## I18n Size Gap Snapshot" >> "$GITHUB_STEP_SUMMARY"
            awk -F',' 'NR>1 {s[$10]++} END {for(k in s) print k, s[k]}' audit/phases/i18n-gap.csv >> "$GITHUB_STEP_SUMMARY"
          fi
