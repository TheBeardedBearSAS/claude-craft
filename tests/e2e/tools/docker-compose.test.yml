services:
  e2e-runner:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ../../..:/workspace:ro
      - ./artifacts:/artifacts
    environment:
      - NO_COLOR=1
    command: >
      bash -c "
      set -eo pipefail;
      which curl && echo 'curl OK' || { echo 'curl NOT found'; exit 1; };
      cd /workspace;
      echo '=== Running E2E test suites ===';
      bats tests/e2e/tools/statusline.bats tests/e2e/tools/ralph.bats tests/e2e/tools/ralph-behavioral.bats tests/e2e/tools/ralph-parallel-session.bats tests/e2e/tools/ralph-set-e.bats tests/e2e/tools/ralph-continuation.bats tests/e2e/tools/ralph-conductor-sessions.bats tests/e2e/tools/ralph-handoff-workers.bats tests/e2e/tools/ralph-unsafe-session-paths.bats tests/e2e/tools/i18n-parity.bats tests/e2e/tools/install-rtk.bats tests/e2e/tools/install-scripts.bats tests/e2e/tools/path-safety.bats | tee /artifacts/e2e-report.txt;
      "
