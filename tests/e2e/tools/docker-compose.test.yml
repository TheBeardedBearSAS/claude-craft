services:
  e2e-runner:
    image: ubuntu:24.04
    working_dir: /workspace
    volumes:
      - ../../..:/workspace:ro
      - ./artifacts:/artifacts
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - NO_COLOR=1
    command: >
      bash -c "
      set -e;
      apt-get update -qq && apt-get install -qq -y --no-install-recommends
        bash curl jq git ca-certificates bats bc > /dev/null;
      cd /workspace;
      echo '=== Running E2E test suites ===';
      bats tests/e2e/tools/statusline.bats
        tests/e2e/tools/ralph.bats
        tests/e2e/tools/install-rtk.bats
        | tee /artifacts/e2e-report.txt;
      "
