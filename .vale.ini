; Vale prose linter configuration for Claude-Craft documentation
; Usage: vale docs/ .claude/ README.md CHANGELOG.md
; Install: https://vale.sh/docs/vale-cli/installation/

StylesPath = styles

MinAlertLevel = suggestion

; Package imports (downloaded via `vale sync`)
Packages = Google, write-good

; Global vocabulary
Vocab = claude-craft

; Documentation files
[docs/*.md]
BasedOnStyles = Vale, Google, write-good

; Disable overly strict rules for technical docs
Google.Acronyms = NO
Google.We = NO
Google.FirstPerson = NO
Google.Passive = suggestion
write-good.Weasel = suggestion
write-good.TooWordy = suggestion

; README and top-level markdown
[*.md]
BasedOnStyles = Vale, Google, write-good

Google.Acronyms = NO
Google.We = NO
Google.FirstPerson = NO
Google.Passive = suggestion
write-good.Weasel = suggestion
write-good.TooWordy = suggestion

; Claude rules and commands (more relaxed)
[.claude/**/*.md]
BasedOnStyles = Vale
Vale.Spelling = NO

; i18n content (skip — multilingual)
[Dev/i18n/**/*.md]
BasedOnStyles = Vale
Vale.Spelling = NO
