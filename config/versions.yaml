# Source unique de vérité des versions — Claude Craft
# ----------------------------------------------------
# Ce fichier est la référence canonique des versions de toutes les technologies
# supportées + l'infra + Claude Code. Il est vérifié en CI par
# `npm run lint:versions` (scripts/verify-versions.mjs), qui échoue si :
#   - une entrée `version` de cli/lib/tech-registry.js diverge de `stacks.<key>.registry`
#   - un token obsolète (denylist) réapparaît dans les fichiers vitrine (.claude/CLAUDE.md, README.md)
#
# PROCÉDURE DE BUMP : modifier ICI, puis propager dans les fichiers listés, puis
# `npm run lint:versions` pour garantir l'absence de dérive.
#
# Dernière mise à jour : 2026-10-13 (audit fraîcheur docs/audit/freshness-2026-10-13.md — React 19.3, Flutter 3.47/Dart 3.13,
# RN 0.87, Vite 8.3, Vercel CLI 63.1.2, Python 3.15, Paperclip 2026.1012.0, Docker 29.9.0, Coolify 4.4.6, K8s 1.37.1,
# OpenTofu 1.13.1, Ansible 2.21.5, hcloud 1.70.1, FrankenPHP 1.13.0 et PgBouncer 1.26.0 (correctifs CVE)).
# CORRECTIF : la note du 2026-07-03 (« RN 0.86 inexistant », 0.86→0.85) était FAUSSE — dist-tags npm vérifiés
# le 2026-10-13 : 0.86-stable=0.86.3, latest=0.87.1. Précédente : audit d'alignement Claude du 2026-10-13 (CLI 2.1.260/2.1.296).

meta:
  lastUpdated: '2026-10-13'

claudeCode:
  # minimum : plancher sécurité — couvre GHSA-5j29 (2.1.129), GHSA-7835 (2.1.163),
  # GHSA-pq7j (2.1.179) et GHSA-gfvf (2.1.260). Audit d'alignement du 2026-10-13.
  minimum: '2.1.260'
  recommended: '2.1.296'
  testedUpTo: '2.1.296'
  # Génération courante (2026-10) : Opus 5.5, Sonnet 5.5, Haiku 5.5, Fable 5.1.
  # Opus 4.8, Sonnet 5, Haiku 4.5 et Fable 5 restent disponibles mais sont legacy.
  models:
    opus: 'claude-opus-5-5'
    sonnet: 'claude-sonnet-5-5'
    sonnetPrev: 'claude-sonnet-5'
    haiku: 'claude-haiku-5-5'
    fable: 'claude-fable-5-1'

# stacks.<key>.registry DOIT être strictement égal à TECH_REGISTRY[<key>].version
stacks:
  csharp: { registry: '10 LTS / C# 14' }
  symfony: { registry: '8.1 / PHP 8.4+' }
  flutter: { registry: '3.47 / Dart 3.13' }
  react: { registry: '19.3 + Compiler 1.0' }
  reactnative: { registry: '0.87' }
  angular: { registry: '22' }
  laravel: { registry: '13.x / PHP 8.3+' }
  vuejs: { registry: '3.5+' }
  vite: { registry: '8.3' }
  vercel: { registry: '63.1.2' }
  php: { registry: '8.5' }
  python: { registry: '3.15 / 3.14+' }
  paperclip: { registry: '2026.1012.0' }
  docker: { registry: '29.9.0' }
  coolify: { registry: '4.4.6' }

# Versions infra non portées par tech-registry (documentées dans devops-engineer.md / CLAUDE.md)
infra:
  kubernetes: '1.37.1'
  opentofu: '1.13.1'
  ansible: '2.21.5'
  hcloud: '1.70.1'
  frankenphp: '1.13.0'
  pgbouncer: '1.26.0'
  helm: '4.2.2'
  node: '24.x (Active LTS) — 22.x Maintenance LTS'

# Tokens OBSOLÈTES qui ne doivent plus apparaître dans les fichiers vitrine.
