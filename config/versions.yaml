  - reason: 'Hausse de prix Sonnet 5 annulée par Anthropic — $2/$10 est le prix standard (source: platform.claude.com/docs/en/about-claude/pricing)'
    tokens:
      - '$3/$15 au 2026-08-31'
      - 'jusqu''au 2026-08-31'
      - 'until 2026-08-31'
      - 'bis 2026-08-31'
      - 'hasta el 2026-08-31'
      - 'puis $3/$15'
