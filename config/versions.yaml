# Affirmations périmées interdites dans des fichiers PRÉCIS (filet complémentaire de `denylist`,
# qui ne couvre que SHOWCASE_FILES). Vérifié par scripts/verify-versions.mjs.
# Motivation : ces trois affirmations sont restées fausses 62 jours sans qu'aucun gate ne les voie.
