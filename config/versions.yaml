  - '0.86 (New Arch'
  - 'OpenTofu 1.12.1'
  - 'Ansible 2.21.0'
  - 'Helm 4.2.0'
  - 'Docker 29.5'
  # Claude Code recommandé périmé (remplacé par 2.1.193 semaine 26)
