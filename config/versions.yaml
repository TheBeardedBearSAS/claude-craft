# Source unique de vérité des versions — Claude Craft
# ----------------------------------------------------
# Ce fichier est la référence canonique des versions de toutes les technologies
# supportées + l'infra + Claude Code. Il est vérifié en CI par
# `npm run lint:versions` (scripts/verify-versions.mjs), qui échoue si :
#   - une entrée `version` de cli/lib/tech-registry.js diverge de `stacks.<key>.registry`
#   - un token obsolète (denylist) réapparaît dans les fichiers vitrine (.claude/CLAUDE.md, README.md)
#
# PROCÉDURE DE BUMP : modifier ICI, puis propager dans les fichiers listés, puis
# `npm run lint:versions` pour garantir l'absence de dérive.
#
# Dernière mise à jour : 2026-06-08 (audit de fraîcheur exhaustif)

meta:
  lastUpdated: '2026-06-08'

claudeCode:
  minimum: '2.1.97'
  recommended: '2.1.168'
  testedUpTo: '2.1.168'
  models:
    opus: 'claude-opus-4-8'
    sonnet: 'claude-sonnet-4-6'
    haiku: 'claude-haiku-4-5'

# stacks.<key>.registry DOIT être strictement égal à TECH_REGISTRY[<key>].version
stacks:
  csharp: { registry: '10 LTS / C# 14' }
  symfony: { registry: '8.1 / PHP 8.4+' }
  flutter: { registry: '3.44 / Dart 3.12' }
  react: { registry: '19.2 + Compiler 1.0' }
  reactnative: { registry: '0.85' }
  angular: { registry: '22' }
  laravel: { registry: '13.x / PHP 8.3+' }
  vuejs: { registry: '3.5+' }
  php: { registry: '8.5' }
  python: { registry: '3.14+' }
  paperclip: { registry: '2026.529.0' }
  docker: { registry: '29.5.2' }
  coolify: { registry: '4.1.1' }

# Versions infra non portées par tech-registry (documentées dans devops-engineer.md / CLAUDE.md)
infra:
  kubernetes: '1.36.1'
  opentofu: '1.12.0'
  ansible: '2.21.0'
  frankenphp: '1.12.1'
  pgbouncer: '1.25.2'
  helm: '3.18'
  node: '20.x (22.x recommandé)'

# Tokens OBSOLÈTES qui ne doivent plus apparaître dans les fichiers vitrine.
# (catch des dérives publiques les plus fréquentes — volontairement spécifiques pour éviter les faux positifs)
denylist:
  - '29.4.3'
  - '29.4.0'
  - 'Coolify v4.0.0'
  - '20 LTS (ou 21)'
  - 'Angular 21 (22'
  - '2026.403.0'
  - '8.0 / PHP 8.4+'
  - '3.41 / Dart 3.11'
