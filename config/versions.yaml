  - '3.41 / Dart 3.11'
  - '2.1.154'
  - '2.1.159'
  - 'claude-opus-4.6'
  - 'claude-sonnet-4-5'
  - 'claude-opus-4-6'
  - 'FrankenPHP 1.12.1'
  - '20.x (22.x recommandé)'
  - '22.x (24.x LTS recommandé)'
  - '29.5.3'
