# SonarCloud analysis — run by .github/workflows/sonarcloud.yml (Automatic Analysis is disabled).
# Project key kept from before the claude-craft -> bear-craft rename (10.0.0): it is an internal
# SonarCloud identifier (dashboard and badge URLs); renaming it would need a manual SonarCloud step.
sonar.projectKey=TheBeardedBearSAS_claude-craft
sonar.organization=thebeardedbearsas
sonar.projectName=bear-craft

# The new SonarCloud analysis scope analyses the whole repository (sonar.sources/sonar.tests have no effect);
# only generated output, scratch dirs and templates are left out. Templates hold Handlebars-style placeholders
# and are not valid code (same exclusions as .github/codeql/codeql-config.yml).
sonar.exclusions=**/node_modules/**,coverage/**,reports/**,.test-tmp/**,\
  website/.vitepress/dist/**,website/.vitepress/cache/**,cli/kanban/client/dist/**,\
  **/templates/**,**/*.template.*,\
  marketplaces/**

# marketplaces/ is generated from the installers (scripts/generate-plugins.mjs): analysing it would duplicate every source file.
sonar.cpd.exclusions=marketplaces/**

# Coverage: Vitest measures cli/**/*.js only, minus its own exclusions (vitest.config.mjs).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=*.js,*.mjs,*.ts,tests/**,scripts/**,website/**,Dev/**,Infra/**,Project/**,Tools/**,\
  .claude/**,.bmad/**,skills-marketplace/**,examples/**,bundles/**,config/**,completions/**,\
  cli/kanban/client/**,cli/lib/flattener.js,cli/lib/kanban.js

# Accepted by design — each entry is one rule on one file, with the reason. Fix the code instead whenever possible.
sonar.issue.ignore.multicriteria=dockerKanbanChmod,ralphPipBuild,cliTargetPath1,cliTargetPath2,cliTargetPath3,cliArgv,pathBin1,pathBin2,pathBin3,pathBin4,pathBin5,pathBin6,kanbanCsp,pathBin7,cliTargetPath4,cliTargetPath5

# The Kanban test image is run with `--user <host uid>` (arbitrary): its scratch dirs must be writable by any uid.
sonar.issue.ignore.multicriteria.dockerKanbanChmod.ruleKey=docker:S2612
sonar.issue.ignore.multicriteria.dockerKanbanChmod.resourceKey=website/tests/kanban/Dockerfile

# Ralph's recovery installs the user's own Python project (`pip install -e .`, `poetry install`), which is built
# from source by definition; the loop already runs that project's code (its test suite) on every iteration.
sonar.issue.ignore.multicriteria.ralphPipBuild.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.ralphPipBuild.resourceKey=Tools/Ralph/lib/recovery-engine.sh

# The CLI reads and writes the project directory its user names on the command line: that path is the input,
# not an injection. cli/lib/path-safety.js refuses system directories before any write.
sonar.issue.ignore.multicriteria.cliTargetPath1.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.cliTargetPath1.resourceKey=cli/lib/detect-project.js
sonar.issue.ignore.multicriteria.cliTargetPath2.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.cliTargetPath2.resourceKey=cli/lib/installer.js
sonar.issue.ignore.multicriteria.cliTargetPath3.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.cliTargetPath3.resourceKey=scripts/stryker-score.mjs
# spawnSync('bash', [script, ...args]): argv array, no shell; the script path is the package's own.
sonar.issue.ignore.multicriteria.cliArgv.ruleKey=jssecurity:S8701
sonar.issue.ignore.multicriteria.cliArgv.resourceKey=cli/lib/installer.js

# bash (the repo's own installers, argv array, no shell) is resolved through PATH, like the other spawned tools above.
sonar.issue.ignore.multicriteria.pathBin7.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.pathBin7.resourceKey=scripts/generate-plugins.mjs
# The plugin installer and the legacy migration receive the project directory the user named on the command line:
# both validate it with assertSafeTarget (system directories refused) and keep every derived path inside it
# (inProject / path.resolve + prefix check) — the taint engine does not recognise those guards.
sonar.issue.ignore.multicriteria.cliTargetPath4.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.cliTargetPath4.resourceKey=cli/lib/plugin-install.js
sonar.issue.ignore.multicriteria.cliTargetPath5.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.cliTargetPath5.resourceKey=cli/lib/migrate-legacy.js

# bash, git, npm and claude are resolved from the user's PATH on purpose: a CLI runs the tools its user installed.
sonar.issue.ignore.multicriteria.pathBin1.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.pathBin1.resourceKey=cli/lib/installer.js
sonar.issue.ignore.multicriteria.pathBin2.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.pathBin2.resourceKey=cli/lib/update.js
sonar.issue.ignore.multicriteria.pathBin3.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.pathBin3.resourceKey=cli/lib/ralph.js
sonar.issue.ignore.multicriteria.pathBin4.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.pathBin4.resourceKey=cli/kanban/server/cli-options.js
sonar.issue.ignore.multicriteria.pathBin5.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.pathBin5.resourceKey=scripts/scan-claude-claims.mjs
sonar.issue.ignore.multicriteria.pathBin6.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.pathBin6.resourceKey=website/tests/kanban/helpers.ts

# The Kanban client sets dynamic style attributes (progress widths, column colours): style-src needs
# 'unsafe-inline'. Scripts stay 'self' only, which is what blocks injection.
sonar.issue.ignore.multicriteria.kanbanCsp.ruleKey=Web:S7039
sonar.issue.ignore.multicriteria.kanbanCsp.resourceKey=cli/kanban/client/index.html
