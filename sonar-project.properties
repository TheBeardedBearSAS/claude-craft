# SonarCloud analysis — run by .github/workflows/sonarcloud.yml (Automatic Analysis is disabled).
sonar.projectKey=TheBeardedBearSAS_claude-craft
sonar.organization=thebeardedbearsas
sonar.projectName=claude-craft

# The new SonarCloud analysis scope analyses the whole repository (sonar.sources/sonar.tests have no effect);
# only generated output, scratch dirs and templates are left out. Templates hold Handlebars-style placeholders
# and are not valid code (same exclusions as .github/codeql/codeql-config.yml).
sonar.exclusions=**/node_modules/**,coverage/**,reports/**,.test-tmp/**,\
  website/.vitepress/dist/**,website/.vitepress/cache/**,cli/kanban/client/dist/**,\
  **/templates/**,**/*.template.*

# Coverage: Vitest measures cli/**/*.js only, minus its own exclusions (vitest.config.mjs).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=*.js,*.mjs,*.ts,tests/**,scripts/**,website/**,Dev/**,Infra/**,Project/**,Tools/**,\
  .claude/**,.bmad/**,skills-marketplace/**,examples/**,bundles/**,config/**,completions/**,\
  cli/kanban/client/**,cli/lib/flattener.js,cli/lib/kanban.js
